<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shop all Blush & Tote handbags. Filter by tote, crossbody, backpack, and wallet styles.">
    <meta name="author" content="Vuyo Faleni">
    <title>Blush & Tote | All Products</title>
    <link rel="icon" href="images/favicon (1).ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">
</head>
<body>
    <header>
        <img src="images/Sello flor rosa.jpg" alt="Blush and Tote Logo" width="150">
        <button id="menu-toggle" aria-label="Open navigation menu">☰</button>
        <nav id="nav">
            <a href="index.html">Home</a>
            <a href="products.html" class="active">Products</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h1>All Handbags</h1>

        <div class="filters">
            <button class="btn filter-btn" data-category="all">All</button>
            <button class="btn filter-btn" data-category="tote">Totes</button>
            <button class="btn filter-btn" data-category="crossbody">Crossbody</button>
            <button class="btn filter-btn" data-category="backpack">Backpacks</button>
        </div>

        <div id="product-grid"></div>
    </main>

    <dialog id="product-modal">
        <button id="close-modal" aria-label="Close modal">X</button>
        <div id="modal-content"></div>
    </dialog>

    <footer>
        <p>&copy; 2026 Blush & Tote | Vuyo Faleni</p>
    </footer>

    <script type="module" src="scripts/main.js"></script>
